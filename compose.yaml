services:
  postgres:
    image: postgres:18
    container_name: subtrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - subtrack-postgres-data:/var/lib/postgresql

volumes:
  subtrack-postgres-data: